[tools]
node = "lts"
pnpm = "latest"

[tasks.install]
description = "Install dependencies from the pnpm lockfile"
run = "pnpm install --frozen-lockfile"

[tasks.dev]
description = "Start the Vite development server"
run = "pnpm dev"

[tasks.test]
description = "Run the test suite"
run = "pnpm test"

[tasks."test:watch"]
description = "Run the test suite in watch mode"
run = "pnpm test:watch"

[tasks.typecheck]
description = "Type-check application source"
run = "pnpm typecheck"

[tasks."typecheck:test"]
description = "Type-check application and test source"
run = "pnpm typecheck:test"

[tasks."validate:data"]
description = "Validate generated registry data"
run = "pnpm validate:data"

[tasks."check:product-contract"]
description = "Check canonical routes, retired taxonomy removal, and detail bundles"
run = "pnpm check:product-contract"

[tasks."browser:acceptance"]
description = "Run managed PinchTab desktop/mobile route acceptance"
run = "pnpm browser:acceptance"

[tasks.verify]
description = "Run the full maintainer verification gate"
run = "pnpm verify"

[tasks.build]
description = "Build the production bundle"
run = "pnpm build"

[tasks.preview]
description = "Preview the production build locally"
run = "pnpm preview"

[tasks."import:catalog"]
description = "Import the reviewed registry catalog"
run = "pnpm import:catalog"

[tasks."sync:registries"]
description = "Refresh the official shadcn registry mirror"
run = "pnpm sync:registries"

[tasks."sync:catalog-evidence"]
description = "Refresh registry catalog evidence"
run = "pnpm sync:catalog-evidence"

[tasks."source-pages"]
description = "Build exact source-page links and coverage from current verified/sitemap evidence"
run = "node scripts/build-source-page-index.mjs --output public/data/component-page-links.json --report data/shadcn/component-page-link-coverage.json"

[tasks.all]
description = "Refresh registry data and run the full verification gate"
run = "pnpm all"
