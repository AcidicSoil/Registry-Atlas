[tools]
bun = "latest"

node = "lts"
pnpm = "latest"
"github:moznion/cccc" = "1.8.0"

[tasks.install]
description = "Install dependencies from the pnpm lockfile"
run = "pnpm install --frozen-lockfile"

[tasks.dev]
description = "Start the development server or production preview"
run = "pnpm dev"

[tasks.lint]
description = "Run all quality checks or a selected lint operation"
run = "pnpm lint"

[tasks.typecheck]
description = "Type-check source and tests"
run = "pnpm typecheck"

[tasks.test]
description = "Run tests or a selected test operation"
run = "pnpm test"

[tasks.build]
description = "Build the production bundle or generated assets"
run = "pnpm build"

[tasks.verify]
description = "Run the full or local verification gate"
run = "pnpm verify"

[tasks.sync]
description = "Run a selected registry or catalog synchronization"
run = "pnpm sync"

[tasks.db]
description = "Run a selected PostgreSQL operation"
run = "pnpm db"

[tasks."audit:dependencies"]
description = "Check dependency vulnerabilities"
run = "pnpm run audit:dependencies"

[tasks."build:source-pages"]
description = "Regenerate verified source-page assets"
run = "pnpm run build:source-pages"

[tasks."lint:complexity"]
description = "Run strict CCCC complexity checks"
run = "pnpm run lint:complexity"

[tasks."test:e2e"]
description = "Build and run browser E2E tests"
run = "pnpm run test:e2e"

[tasks."test:local"]
description = "Run the offline unit test subset"
run = "pnpm run test:local"

[tasks."typecheck:tests"]
description = "Type-check test sources"
run = "pnpm run typecheck:tests"

[tasks."verify:local"]
description = "Run the offline verification workflow"
run = "pnpm run verify:local"
