name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full offline Linux checks
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - name: Restore pinned offline test data
        run: tar -xf tests/fixtures/ci-runtime.tar
      - name: Full available offline checks
        run: mise run verify:local
