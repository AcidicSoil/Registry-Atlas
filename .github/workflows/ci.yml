name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full offline Linux checks
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - run: pnpm install --frozen-lockfile
      - name: Prepare runtime data
        run: node scripts/project-tasks.mjs build:prepare-runtime-data
      - name: Full available offline checks
        run: node scripts/project-tasks.mjs verify:local

      - name: Upload verified main build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: local-build-linux-x64
          path: dist/
          if-no-files-found: error
          retention-days: 14
