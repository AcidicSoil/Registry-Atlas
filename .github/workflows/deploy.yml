name: Registry Atlas source checks

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Database-backed releases are built from the private self-hosted database.
# Do not run untrusted public PR code on a self-hosted runner.
# Pages deployment is paused until a separate trusted publisher is configured.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check new commit message format
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$BEFORE_SHA" =~ ^0+$ || -z "$BEFORE_SHA" ]]; then
            node scripts/check-commit-message.mjs --range "HEAD^..HEAD"
          else
            node scripts/check-commit-message.mjs --range "$BEFORE_SHA..$HEAD_SHA"
          fi
      - uses: jdx/mise-action@v4
      - name: Install dependencies
        run: mise run install
      - name: Check source without a database connection
        run: |
          pnpm audit:dependencies
          pnpm lint:anti-slop
          pnpm lint:deps
          pnpm lint:react-doctor
          pnpm lint:complexity
          pnpm typecheck
          pnpm typecheck:test
