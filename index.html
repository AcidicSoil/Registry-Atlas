<!DOCTYPE html>
<html lang="en">
<head>
  <script type="module">
    if (import.meta.env.DEV) import("react-grab");
  </script>
  <meta charset="UTF-8" />
  <title>Registry Atlas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/styles/registry-explorer.css" />
</head>
<body>
  <div id="app">
    <div class="app-inner">
      <header class="mobile-app-header">
        <button
          id="sidebarToggle"
          class="sidebar-toggle"
          type="button"
          aria-controls="appSidebar"
          aria-expanded="false"
          aria-label="Open navigation">☰</button>
        <a class="brand brand-home-link" href="/Registry-Atlas/" aria-label="Registry Atlas home">
          <span class="brand-logo"><span class="brand-logo-inner">R</span></span>
          <span class="brand-title">Registry Atlas</span>
        </a>
      </header>

      <button id="sidebarBackdrop" class="sidebar-backdrop" type="button" aria-label="Close navigation" hidden></button>

      <main>
        <aside id="appSidebar" class="app-sidebar" data-open="false" aria-label="Registry Atlas navigation">
          <div class="sidebar-topbar">
            <a class="brand brand-home-link" href="/Registry-Atlas/" aria-label="Registry Atlas home">
              <span class="brand-logo"><span class="brand-logo-inner">R</span></span>
              <span class="brand-title">Registry Atlas</span>
            </a>
            <button id="sidebarClose" class="sidebar-close" type="button" aria-label="Close navigation">×</button>
          </div>

          <div class="search-bar">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input
              id="searchInput"
              type="search"
              class="search-input"
              placeholder="Search catalog"
              aria-label="Search catalog"
            />
          </div>

          <nav class="primary-nav" aria-label="Primary navigation">
            <button type="button" class="nav-item nav-item-active" data-view="home">Home</button>
            <div class="nav-section-label">Explore</div>
            <button type="button" class="nav-item" data-view="discover">Components</button>
            <button type="button" class="nav-item" data-view="templates">Templates</button>
            <button type="button" class="nav-item" data-view="themes">Themes</button>
            <button type="button" class="nav-item" data-view="icons">Icon-related assets</button>
            <button type="button" class="nav-item" data-view="registries">Registries</button>
            <div class="nav-section-label">Tools</div>
            <button type="button" class="nav-item" data-view="compare">Compare</button>
          </nav>

          <div class="aside-inner" id="aside"></div>
        </aside>

        <section class="content">
          <div class="content-header" id="contentHeader"></div>
          <div class="content-body">
            <div class="scroll-region" id="contentBody"></div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script type="module" src="/src/registry-explorer/entry.ts"></script>
</body>
</html>
