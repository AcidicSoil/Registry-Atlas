<!DOCTYPE html>
<html lang="en">
<head>
  <script type="module">
      // first npm i react-grab
      // then in head:
      if (import.meta.env.DEV) {
        import("react-grab");
      }
    </script>
  <meta charset="UTF-8" />
  <title>Registry Atlas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Optional: custom font -->
  <!-- <link href="https://fonts.googleapis.com/css2?family=Chivo:wght@300;400;600;700&display=swap" rel="stylesheet"> -->

  <link rel="stylesheet" href="/styles/registry-explorer.css" />
</head>
<body>
  <div id="app">
    <div class="app-inner">
      <header class="app-header">
        <div class="brand">
          <div class="brand-logo">
            <div class="brand-logo-inner">R</div>
          </div>
          <div class="brand-text">
            <div class="brand-title">Registry Atlas</div>
            <div class="brand-subtitle">Shadcn-Based Component Index</div>
          </div>
        </div>
        <div class="header-right">
          <div class="search-bar">
            <div class="search-icon">⌕</div>
            <input
              id="searchInput"
              type="search"
              class="search-input"
              placeholder="Search components, items, registries, or aliases"
              aria-label="Search components, items, registries, or aliases"
            />
          </div>
          <nav class="primary-nav" aria-label="Primary navigation">
            <button type="button" class="nav-item nav-item-active" data-view="discover">Discover</button>
            <button type="button" class="nav-item" data-view="registries">Registries</button>
            <button type="button" class="nav-item" data-view="compare">Compare</button>
          </nav>
        </div>
      </header>

      <main>
        <aside>
          <div class="aside-inner" id="aside"></div>
        </aside>
        <section class="content">
          <div class="content-header" id="contentHeader"></div>
          <div class="content-body">
            <div class="scroll-region" id="contentBody"></div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script type="module" src="/src/registry-explorer/entry.ts"></script>
</body>
</html>
