packages:
  - "."

overrides:
  esbuild: 0.28.1
  # Fix advisories in the directly used validation layer and nested tooling.
  zod: 4.6.6
  fast-uri: 3.1.9
  # ESLint 10 still requests minimatch 10; 11.0.1 fixes GHSA-g3hv-75wg-m249.
  minimatch: 11.0.1

# Only audited, version-specific native binary setup is trusted.
allowBuilds:
  esbuild@0.28.1: true
  es5-ext@0.10.64: false

minimumReleaseAgeExclude:
  - knip@6.44.0
